<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1400" height="720" fill="#fff"/><text x="40" y="44" font-size="24" font-weight="700" fill="#111827">Camel Guard — System Block Diagram (highway camel crossing)</text><text x="40" y="68" font-size="14" fill="#4b5563">Camel gate (2 IR obstacle) + 2 HC-SR04 (vehicle) sensors + 2 INA219 (solar panel, battery) → ESP32 edge decision → yellow lamp, warning signs, buzzer; WiFi telemetry → PC dashboard</text><rect x="40" y="92" width="300" height="72" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="190.0" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Camel IR A (D13)</text><text x="190.0" y="140" font-size="13" text-anchor="middle" fill="#374151">camel gate · side-A edge</text><line x1="340" y1="128" x2="470" y2="365" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="192" width="300" height="72" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="190.0" y="218" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Camel IR B (D14)</text><text x="190.0" y="240" font-size="13" text-anchor="middle" fill="#374151">camel gate · side-B edge</text><line x1="340" y1="228" x2="470" y2="365" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="292" width="300" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="190.0" y="318" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">HC-SR04 car sensor A</text><text x="190.0" y="340" font-size="13" text-anchor="middle" fill="#374151">side A · 400 m point · across the lane</text><line x1="340" y1="328" x2="470" y2="365" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="392" width="300" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="190.0" y="418" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">HC-SR04 car sensor B</text><text x="190.0" y="440" font-size="13" text-anchor="middle" fill="#374151">side B · 400 m point · across the lane</text><line x1="340" y1="428" x2="470" y2="365" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="492" width="300" height="72" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="190.0" y="518" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">2× INA219 (I2C)</text><text x="190.0" y="540" font-size="13" text-anchor="middle" fill="#374151">solar panel V / A · battery V / A</text><line x1="340" y1="528" x2="470" y2="365" stroke="#d97706" stroke-width="2.5" marker-end="url(#a)"/><rect x="470" y="240" width="340" height="250" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="640.0" y="266" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">ESP32 DevKit V1</text><text x="640.0" y="288" font-size="13" text-anchor="middle" fill="#374151">camel = an IR blocked for several readings</text><text x="640.0" y="307" font-size="13" text-anchor="middle" fill="#374151">side = the IR that fired first · hold timer</text><text x="640.0" y="326" font-size="13" text-anchor="middle" fill="#374151">car passing 400 m point: HC-SR04 ≤ carCm</text><text x="640.0" y="345" font-size="13" text-anchor="middle" fill="#374151">car + camel → signs flash fast + buzzer</text><text x="640.0" y="364" font-size="13" text-anchor="middle" fill="#374151">yellow lamp always flashing</text><text x="640.0" y="383" font-size="13" text-anchor="middle" fill="#374151">state machine:</text><text x="640.0" y="402" font-size="13" text-anchor="middle" fill="#374151">CLEAR · WARNING · DANGER</text><rect x="960" y="160" width="300" height="76" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="1110.0" y="186" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">74HC595 (A + B in parallel)</text><text x="1110.0" y="208" font-size="13" text-anchor="middle" fill="#374151">yellow lamp · 300/200/100 m · camel sign</text><line x1="810" y1="365" x2="960" y2="198" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="960" y="290" width="300" height="76" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="1110.0" y="316" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Buzzer (NPN)</text><text x="1110.0" y="338" font-size="13" text-anchor="middle" fill="#374151">at the crossing</text><line x1="810" y1="365" x2="960" y2="328" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="960" y="540" width="300" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1110.0" y="566" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">PC Dashboard (Python)</text><text x="1110.0" y="588" font-size="13" text-anchor="middle" fill="#374151">live highway view · charts · logs</text><text x="1110.0" y="607" font-size="13" text-anchor="middle" fill="#374151">settings · output test · firmware</text><line x1="640" y1="480" x2="640" y2="595" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="640" y1="595" x2="960" y2="595" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a)"/><text x="800.0" y="588.0" font-size="12" text-anchor="middle" fill="#475569">WiFi · JSON telemetry every 1 s</text><text x="660" y="540" font-size="12" fill="#7c3aed">commands back (settings, CLEAR, alert, test)</text><rect x="465" y="570" width="165" height="90" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="547.5" y="596" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Power</text><text x="547.5" y="618" font-size="13" text-anchor="middle" fill="#374151">solar → TP4056 → 18650</text><text x="547.5" y="637" font-size="13" text-anchor="middle" fill="#374151">→ 5 V boost (or USB)</text></svg>