<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1400" height="600" fill="#fff"/><text x="40" y="44" font-size="24" font-weight="700" fill="#111827">Road State Machine (runs on the ESP32 every 100 ms)</text><rect x="60" y="110" width="260" height="140" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="190" y="146" font-size="20" font-weight="800" text-anchor="middle" fill="#d97706">WARMUP</text><text x="190" y="176" font-size="13" text-anchor="middle" fill="#374151">first 3 s after power-on</text><text x="190" y="195" font-size="13" text-anchor="middle" fill="#374151"></text><text x="190" y="230" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">yellow lamp flashing</text><rect x="400" y="110" width="260" height="140" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="530" y="146" font-size="20" font-weight="800" text-anchor="middle" fill="#16a34a">CLEAR</text><text x="530" y="176" font-size="13" text-anchor="middle" fill="#374151">no camel at the gate</text><text x="530" y="195" font-size="13" text-anchor="middle" fill="#374151"></text><text x="530" y="230" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">lamp flashing, signs off</text><rect x="740" y="110" width="260" height="140" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="870" y="146" font-size="20" font-weight="800" text-anchor="middle" fill="#ea580c">WARNING</text><text x="870" y="176" font-size="13" text-anchor="middle" fill="#374151">camel confirmed (IR)</text><text x="870" y="195" font-size="13" text-anchor="middle" fill="#374151">(or manual alert)</text><text x="870" y="230" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">300/200/100 m signs flash</text><rect x="1080" y="110" width="260" height="140" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1210" y="146" font-size="20" font-weight="800" text-anchor="middle" fill="#dc2626">DANGER</text><text x="1210" y="176" font-size="13" text-anchor="middle" fill="#374151">WARNING + car passed the</text><text x="1210" y="195" font-size="13" text-anchor="middle" fill="#374151">400 m point (A or B)</text><text x="1210" y="230" font-size="12" font-weight="600" text-anchor="middle" fill="#111827">signs fast + buzzer</text><line x1="320" y1="180" x2="400" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="660" y1="180" x2="740" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="1000" y1="180" x2="1080" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="292" font-size="15" font-weight="700" fill="#111827">Yellow caution lamp: always flashing (1 Hz), in every state — camel or not.</text><text x="40" y="324" font-size="16" font-weight="700" fill="#111827">Decision rules</text><text x="60" y="356" font-size="14" fill="#374151">• IR trigger = camel IR A or B blocked for confirm readings of 50 ms in a row (default 3)</text><text x="60" y="386" font-size="14" fill="#374151">• camel = a camel IR confirmed (blocked as above); the first IR gives the side; no PIR</text><text x="60" y="416" font-size="14" fill="#374151">• a camel is held while an IR still sees it, then holdSec (5 s); leaving through the other IR counts once</text><text x="60" y="446" font-size="14" fill="#374151">• car approaching = HC-SR04 at the 400 m point of side A / B read ≤ carCm across the lane within approachSec (8 s)</text><text x="60" y="476" font-size="14" fill="#374151">• hazard = camel OR manual alert; hazard + vehicle approaching = DANGER</text><text x="60" y="506" font-size="14" fill="#374151">• the decision never depends on WiFi or the PC; the dashboard only monitors, logs and configures</text></svg>